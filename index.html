<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Mini Store - Flipkart Minutes</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 10px; }
        .header { background: #ff5722; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .search-box { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .card { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h4 { margin: 5px 0; font-size: 14px; color: #333; }
        .price { font-weight: bold; color: #2e7d32; font-size: 16px; }
        .add-btn { background: #2e7d32; color: white; border: none; padding: 6px 12px; border-radius: 4px; float: right; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Sunny Mini Store</h2>
        <p>📍 Ghansoli, Navi Mumbai | ⚡ 10 mins delivery</p>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Search 'Milk', 'Ghee', 'Atta'..." onkeyup="searchProducts()">

    <div class="grid" id="productGrid">
        <div class="card">
            <h4>Gowardhan Pure Cow Ghee</h4>
            <p>200 ml</p>
            <span class="price">₹187</span>
            <button class="add-btn" onclick="addToCart('Ghee')">ADD</button>
        </div>
        <div class="card">
            <h4>Amul Fresh Taaza Milk</h4>
            <p>1 Litre</p>
            <span class="price">₹32</span>
            <button class="add-btn" onclick="addToCart('Milk')">ADD</button>
        </div>
    </div>

    <script>
        function searchProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            // Yahan live search API ya local items filter honge
            console.log("Searching for: " + input);
        }

        function addToCart(item) {
            alert(item + " cart mein add kar diya gaya hai!");
        }
    </script>

</body>
</html>
